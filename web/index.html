<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Chat</title>
	<style>
		body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
		#messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 8px; margin-bottom: 8px; }
		#messages div { margin-bottom: 4px; }
		#form { display: flex; gap: 8px; }
		#input { flex: 1; padding: 6px; }
	</style>
</head>
<body>
	<h2>Test Chat</h2>
	<div id="messages"></div>
	<form id="form">
		<input id="input" autocomplete="off" placeholder="Введите сообщение..." />
		<button type="submit">Отправить</button>
	</form>

	<script>
		// Подключаемся к нашему /ws эндпоинту.
		// window.location.host — автоматически подставит текущий host:port,
		// чтобы страница работала и локально, и после деплоя без переписывания URL.
		const ws = new WebSocket(`ws://${window.location.host}/ws`);

		const messagesEl = document.getElementById('messages');
		const formEl = document.getElementById('form');
		const inputEl = document.getElementById('input');

		// Срабатывает при получении сообщения ОТ СЕРВЕРА
		// (то есть от Hub.Broadcast — включая сообщения от других вкладок)
		ws.onmessage = (event) => {
			const div = document.createElement('div');
			div.textContent = event.data;
			messagesEl.appendChild(div);
			messagesEl.scrollTop = messagesEl.scrollHeight;
		};

		ws.onopen = () => {
			console.log('WebSocket connected');
		};

		ws.onclose = () => {
			console.log('WebSocket disconnected');
		};

		// При отправке формы — шлём текст в сокет и очищаем поле
		formEl.addEventListener('submit', (e) => {
			e.preventDefault();
			if (inputEl.value.trim() === '') return;
			ws.send(inputEl.value);
			inputEl.value = '';
		});
	</script>
</body>
</html>
