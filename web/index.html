<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Chat</title>
	<style>
		body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
		#messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 8px; margin-bottom: 8px; }
		#messages div { margin-bottom: 4px; }
		#form { display: flex; gap: 8px; }
		#input { flex: 1; padding: 6px; }
		#name { width: 120px; padding: 6px; margin-bottom: 8px; }
	</style>
</head>
<body>
	<h2>Test Chat</h2>
	<input id="name" placeholder="Ваше имя" value="anon" />
	<div id="messages"></div>
	<form id="form">
		<input id="input" autocomplete="off" placeholder="Введите сообщение..." />
		<button type="submit">Отправить</button>
	</form>

	<script>
		const ws = new WebSocket(`ws://${window.location.host}/ws`);

		const messagesEl = document.getElementById('messages');
		const formEl = document.getElementById('form');
		const inputEl = document.getElementById('input');
		const nameEl = document.getElementById('name'); // ← добавили

		ws.onmessage = (event) => {
			const msg = JSON.parse(event.data);
			const div = document.createElement('div');
			div.textContent = `${msg.author}: ${msg.payload}`;
			messagesEl.appendChild(div);
			messagesEl.scrollTop = messagesEl.scrollHeight;
		};

		ws.onopen = () => {
			console.log('WebSocket connected');
		};

		ws.onclose = () => {
			console.log('WebSocket disconnected');
		};

		formEl.addEventListener('submit', (e) => {
			e.preventDefault();
			if (inputEl.value.trim() === '') return;

			ws.send(JSON.stringify({
				type: 'chat',
				author: nameEl.value || 'anon',
				payload: inputEl.value,
			}));
			inputEl.value = '';
		});
	</script>
</body>
</html>
